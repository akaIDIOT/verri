on:
  push:
    branches: ['main']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: '3.15'
          cache: true
          cache-dependency-path: 'pylock.toml'
      - run: pdm install --group check
      - run: pdm run check
  test:
    runs-on: ubuntu-latest
    needs: check
    continue-on-error: ${{ matrix.prerelease }}
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        prerelease: [false]
        include:
          - python-version: '3.16'
            prerelease: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 10
      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ matrix.python-version }}
          allow-python-prereleases: ${{ matrix.prerelease }}
          cache: true
          cache-dependency-path: 'pylock.toml'
      - run: pdm install --group test
      - run: pdm run test
