[project]
dynamic = ["version"]
name = "verri"
import-names = ["verri"]
description = "Verri version, such flavour, wow"
keywords = ["calver", "pep-440", "pdm", "pdm-backend", "version"]
readme = "README.md"
license = "EUPL-1.2"
authors = [
    {name = "Mattijs Ugen", email = "144798+akaIDIOT@users.noreply.github.com"},
]
maintainers = [
    {name = "Mattijs Ugen"},
]
dependencies = [
    "packaging>=26.0",
]
requires-python = ">=3.11"
scripts = {verri = "verri.console:main"}

[project.urls]
Docs = "https://akaidiot.github.io/verri/"
Homepage = "https://github.com/akaIDIOT/verri/"

[dependency-groups]
check = [
    "ruff",
    "rumdl",
    "simplint",
]
docs = [
    "mkdocstrings-python",
    "zensical",
]
test = [
    "coverage",
    "freezegun",
    "pytest",
]

[tool.pdm.version]
source = "call"
getter = "verri.tasty:pineapple"

[tool.pdm.scripts]
all = {composite = [
    "check",
    "test",
    "docs",
]}
check = {keep_going = true, composite = [
    "pdm lock --check",
    "ruff format --diff verri/ tests/",
    "ruff check verri/ tests/",
    "simplint check verri/ tests/",
    "rumdl check",
]}
docs = "zensical build --clean --strict"
fix = {composite = [
    "ruff format verri/ tests/",
    "ruff check --fix verri/ tests/",
    "simplint check --fix verri/ tests/",
    "rumdl fmt",
]}
test = {composite = [
    "coverage run --branch --source verri --module pytest tests/",
    # run verri's own module entry point through coverage to make sure that works and is covered
    "coverage run --append --branch --source verri --module verri tasty pineapple",
    "coverage report",
]}

[tool.ruff]
format.quote-style = "single"
lint.flake8-quotes.inline-quotes = "single"
line-length = 120
lint.external = [
    "SMP",  # simplint
]
lint.isort.lines-after-imports = 2
lint.select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "Q",  # quotes
    "RUF100",  # unused noqa
    "RUF101",  # redirected noqa
    "UP",  # pyupgrade
]

[tool.rumdl]
include = ["README.md", "docs/*.md", "tests/repos/README.md"]
line-length = 120
respect-gitignore = true

[tool.rumdl.MD013]
reflow = true

[tool.rumdl.MD029]
style = "ordered"

[tool.simplint]
select = [
    "SMP1",  # naming
    "SMP2",  # layout
    "SMP5",  # logic
    "SMP7",  # classes
    "SMP8",  # tests
    "SMP9",  # docstrings
]
ignore = [
    "SMP504",  # allow single-use locals
    "SMP505",  # allow single-use helper functions
    "SMP807",  # allow assert statements that could be combined
]
per-file-ignores = {"verri/__main__.py" = ["SMP106"]}  # avoid __name__ == '__main__' in … __main__.py}

[build-system]
# NB: using pdm-backend's own trick to allow a project depend on itself during a build
#     normally, verri should be added to the requires field and the build-backend should be "pdm.backend"
requires = ["pdm-backend"]
build-backend = "pdm.backend.intree"
